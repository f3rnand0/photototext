services:
  # Backend API Service
  - type: web
    name: photototext-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AZURE_OCR_ENDPOINT
        sync: false
      - key: AZURE_OCR_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://photototext.onrender.com"

  # Frontend Static Site
  - type: static
    name: photototext
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://photototext-api.onrender.com"