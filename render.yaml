services:
  # Backend API Service
  - type: web
    name: photototext-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AZURE_OCR_ENDPOINT
        sync: false
      - key: AZURE_OCR_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://photototext.onrender.com"
      - key: DEBUG
        value: "true"  # Set to "false" to disable debug logging in production
      - key: SENTRY_DSN
        value: "https://3d124ee6551f082ba3ec59a7ae444998@o4510981719326720.ingest.de.sentry.io/4510981721096272"

  # Frontend Static Site
  - type: web
    name: photototext
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://photototext-api.onrender.com"
      - key: NEXT_PUBLIC_DEBUG
        value: "true"  # Set to "false" to disable debug logging in production
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: "https://3d124ee6551f082ba3ec59a7ae444998@o4510981719326720.ingest.de.sentry.io/4510981721096272"